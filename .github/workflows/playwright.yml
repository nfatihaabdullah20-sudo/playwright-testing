name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      BASE_URL: 'https://mytnbawprtw-s.mytnb.com.my:8041/'

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci

    - name: Check target availability
      run: |
        echo "Checking connectivity to $BASE_URL..."
        curl -v --max-time 15 --insecure "$BASE_URL" || (echo -e "\n[ERROR] Runner cannot reach the target URL. Check firewall or internal network restrictions." && exit 1)

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
